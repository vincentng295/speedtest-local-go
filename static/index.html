<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speedtest by LAN</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231fe3c6' stroke-width='2.4' stroke-linecap='round'%3E%3Cpath d='M4.5 17.5a9 9 0 1 1 15 0'/%3E%3Cpath d='M12 14l4-5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M4.5 17.5a9 9 0 1 1 15 0"/><path d="M12 14l4-5"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5.5 20c0-3.4 2.9-5.5 6.5-5.5s6.5 2.1 6.5 5.5"/></symbol>
  <symbol id="i-server" viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="4.2" rx="1"/><rect x="4.5" y="9" width="6" height="4.2" rx="1"/><rect x="13.5" y="9" width="6" height="4.2" rx="1"/><rect x="4.5" y="14.5" width="6" height="4.2" rx="1"/><rect x="13.5" y="14.5" width="6" height="4.2" rx="1"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.3l3 3 6-6.3"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-conn" viewBox="0 0 24 24"><path d="M3 7h12M3 12h12M3 17h12" stroke-dasharray="1.6 2.2"/><path d="M14 4.8L17.5 7 14 9.2M14 9.8l3.5 2.2-3.5 2.2M14 14.8l3.5 2.2-3.5 2.2"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-burger" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v16M5.5 12.5L12 19l6.5-6.5"/></symbol>
</defs></svg>

<header class="top">
  <div class="top-inner">
    <div class="left">
      <a class="logo" href="/">
        <svg class="ic" width="26" height="26"><use href="#i-logo"/></svg>
        <span>SPEEDTEST<sup>&reg;</sup></span>
      </a>
      <div class="nav-desktop">
        <div class="dd" id="dd-menu">
          <button class="nav-btn" data-dd><span data-i18n="menu">Menu</span><svg class="ic" width="20" height="20"><use href="#i-chev"/></svg></button>
          <div class="dd-menu">
            <button data-view="test" data-i18n="test">Speedtest</button>
            <button data-view="results" data-i18n="results">Results</button>
            <button data-view="settings" data-i18n="settings">Settings</button>
          </div>
        </div>
        <div class="dd" id="dd-lang">
          <button class="nav-btn" data-dd><span id="langLabel">English</span><svg class="ic" width="20" height="20"><use href="#i-chev"/></svg></button>
          <div class="dd-menu">
            <button data-lang="en">English</button>
            <button data-lang="vi">Tiếng Việt</button>
          </div>
        </div>
      </div>
      <button class="theme" id="theme" aria-label="Toggle theme">
        <span class="sun"><svg class="ic" width="18" height="18"><use href="#i-sun"/></svg></span>
        <span class="moon"><svg class="ic" width="18" height="18"><use href="#i-moon"/></svg></span>
      </button>
    </div>
    <div class="right nav-desktop">
      <div class="dd right" id="dd-dl">
        <button class="pill grad" data-dd><span data-i18n="download">Download</span><svg class="ic" width="20" height="20"><use href="#i-chev"/></svg></button>
        <div class="dd-menu">
          <button id="copyLink" data-i18n="copy">Copy LAN link</button>
          <button id="exportCsv" data-i18n="export">Export results (CSV)</button>
        </div>
      </div>
      <button class="pill" id="signin" data-i18n="signin">Sign In</button>
    </div>
    <button class="burger" id="burger" aria-label="Menu"><svg class="ic" width="28" height="28"><use href="#i-burger"/></svg></button>
  </div>
  <div class="grad-line"></div>
  <div class="mnav" id="mnav">
    <button data-view="test" data-i18n="test">Speedtest</button>
    <button data-view="results" data-i18n="results">Results</button>
    <button data-view="settings" data-i18n="settings">Settings</button>
    <button data-lang="en">English</button>
    <button data-lang="vi">Tiếng Việt</button>
    <button class="copyLink" data-i18n="copy">Copy LAN link</button>
    <button class="exportCsv" data-i18n="export">Export results (CSV)</button>
  </div>
</header>

<main>
  <div class="tabs">
    <button class="tab" data-view="results"><svg class="ic" width="22" height="22"><use href="#i-check"/></svg><span data-i18n="results">Results</span></button>
    <button class="tab" data-view="settings"><svg class="ic" width="22" height="22"><use href="#i-gear"/></svg><span data-i18n="settings">Settings</span></button>
  </div>

  <section id="view-test" class="view">
    <button class="go" id="go" aria-label="Start test">
      <svg class="ring" viewBox="0 0 224 224"><circle class="ring-fg" id="ringFg" cx="112" cy="112" r="106"/></svg>
      <span class="gtxt">GO</span>
      <span class="gauge">
        <small id="gPhase">Ping</small>
        <b id="gNum">0</b>
        <em id="gUnit">ms</em>
      </span>
    </button>

    <div class="stats" id="stats">
      <div class="stat" data-k="ping"><small data-i18n="ping">Ping</small><div><b>—</b><i>ms</i></div></div>
      <div class="stat" data-k="jitter"><small data-i18n="jitter">Jitter</small><div><b>—</b><i>ms</i></div></div>
      <div class="stat" data-k="dl"><small data-i18n="dl">Download</small><div><b>—</b><i class="u">Mbps</i></div></div>
      <div class="stat" data-k="ul"><small data-i18n="ul">Upload</small><div><b>—</b><i class="u">Mbps</i></div></div>
    </div>

    <div class="info">
      <div class="grp l">
        <div class="txt"><div class="nm" id="isp">—</div><div class="sub" id="ip">—</div></div>
        <div class="ico"><svg class="ic" width="24" height="24"><use href="#i-user"/></svg></div>
      </div>
      <div class="grp r">
        <div class="ico"><svg class="ic" width="24" height="24"><use href="#i-server"/></svg></div>
        <div class="txt"><div class="nm" id="srv">—</div><div class="sub" id="loc">—</div><a href="#" class="link" id="chg" data-i18n="change">Change Server</a></div>
      </div>
      <button class="scrolldown" id="scrolldown" aria-label="More"><svg class="ic" width="26" height="26"><use href="#i-down"/></svg></button>
    </div>

    <div class="conn">
      <div class="cap" data-i18n="connections">Connections</div>
      <div class="sw">
        <button id="mMulti" class="on" data-i18n="multi">Multi</button>
        <button class="ico sm" id="mToggle" aria-label="Toggle connections"><svg class="ic" width="22" height="22"><use href="#i-conn"/></svg></button>
        <button id="mSingle" data-i18n="single">Single</button>
      </div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="tile">
          <svg viewBox="0 0 160 110" width="160" height="110"><rect x="14" y="10" width="132" height="76" rx="6" fill="#16507a"/><rect x="20" y="16" width="14" height="64" rx="3" fill="#1f6aa0"/><rect x="48" y="16" width="64" height="64" rx="4" fill="#0b2233" stroke="#555" stroke-width=".6"/><circle cx="80" cy="46" r="13" fill="none" stroke="#e8e8e8" stroke-width="2"/><path d="M80 46l7-7" stroke="#e8e8e8" stroke-width="2" stroke-linecap="round"/><rect x="66" y="86" width="28" height="8" fill="#1d6f9a"/><rect x="52" y="94" width="56" height="4" rx="2" fill="#2e8bb5"/></svg>
        </div>
        <span data-i18n="desktop">Desktop Apps</span>
      </div>
      <div class="card">
        <div class="tile">
          <svg viewBox="0 0 160 110" width="160" height="110"><rect x="30" y="14" width="100" height="62" rx="4" fill="#1b2a47"/><rect x="36" y="19" width="32" height="2.4" rx="1" fill="#59a6ff"/><g fill="none" stroke="#35f2e0" stroke-width="4" stroke-linecap="round"><path d="M64 42a22 22 0 0 1 32 0"/><path d="M71 49a13 13 0 0 1 18 0"/></g><circle cx="80" cy="57" r="3" fill="#35f2e0"/><path d="M80 76v24" stroke="#ccc" stroke-width="1.5"/><rect x="76" y="96" width="8" height="8" fill="#35f2e0"/><path d="M14 40v28" stroke="#ccc" stroke-width="1.5"/><rect x="10" y="36" width="8" height="8" fill="#35a4ff"/><path d="M146 40v28" stroke="#ccc" stroke-width="1.5"/><rect x="142" y="36" width="8" height="8" fill="#b36bff"/></svg>
        </div>
        <span data-i18n="wifi">Troubleshoot Your Wifi</span>
      </div>
    </div>
  </section>

  <section id="view-results" class="view panel" hidden>
    <div class="phead"><h2 data-i18n="results">Results</h2><button class="link-btn" id="clearHist" data-i18n="clear">Clear history</button></div>
    <div class="tscroll"><table id="histTable"><thead><tr><th data-i18n="date">Date</th><th data-i18n="ping">Ping</th><th data-i18n="jitter">Jitter</th><th data-i18n="dl">Download</th><th data-i18n="ul">Upload</th></tr></thead><tbody></tbody></table></div>
    <p class="empty" id="histEmpty" data-i18n="empty">No results yet. Press GO to run a test.</p>
  </section>

  <section id="view-settings" class="view panel" hidden>
    <div class="phead"><h2 data-i18n="settings">Settings</h2></div>
    <label class="row"><span data-i18n="duration">Test duration per phase</span>
      <select id="s-duration"><option value="5">5 s</option><option value="10">10 s</option><option value="15">15 s</option><option value="20">20 s</option></select></label>
    <label class="row"><span data-i18n="streams">Parallel streams (Multi)</span>
      <input type="number" id="s-streams" min="2" max="16"></label>
    <label class="row"><span data-i18n="unit">Speed unit</span>
      <select id="s-unit"><option value="mbps">Mbps</option><option value="MBps">MB/s</option></select></label>
  </section>
</main>

<div class="toast" id="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
